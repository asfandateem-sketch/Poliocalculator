<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Circular shield glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#14b8a6" stroke-width="8" opacity="0.35" />
  <circle cx="256" cy="256" r="150" fill="#134e4a" opacity="0.4" />
  
  <!-- Vaccine Dropper / Two Drops Motif (2 drops per child) -->
  <g filter="url(#shadow)">
    <!-- Main Drop 1 -->
    <path d="M220 180 C220 130, 240 100, 240 100 C240 100, 260 130, 260 180 C260 210, 242 225, 240 225 C238 225, 220 210, 220 180 Z" fill="#22d3ee" />
    <!-- Main Drop 2 -->
    <path d="M256 220 C256 160, 280 130, 280 130 C280 130, 304 160, 304 220 C304 252, 283 268, 280 268 C277 268, 256 252, 256 220 Z" fill="url(#dropGrad)" />
    
    <!-- Child protection shield outline -->
    <path d="M256 100 L370 144 V260 C370 340, 256 400, 256 400 C256 400, 142 340, 142 260 V144 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Medical Plus Symbol inside bottom of shield -->
    <path d="M256 295 V355 M226 325 H286" stroke="#34d399" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
