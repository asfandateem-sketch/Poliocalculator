<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Left: Big Logo Emblem -->
  <g transform="translate(100, 115)">
    <!-- Container -->
    <rect width="400" height="400" rx="80" fill="#0d9488" stroke="#2dd4bf" stroke-width="4" opacity="0.9" />
    <!-- Shield -->
    <path d="M 200 65 C 270 65 310 90 310 90 L 310 200 C 310 280 230 330 200 350 C 170 330 90 280 90 200 L 90 90 C 90 90 130 65 200 65 Z" fill="#134e4a" stroke="#ffffff" stroke-width="8" />
    <!-- Droplets -->
    <path d="M 175 175 C 175 145 192 122 192 122 C 192 122 208 145 208 175 C 208 193 194 205 192 205 C 190 205 175 193 175 175 Z" fill="#5eead4" />
    <path d="M 198 198 C 198 165 218 140 218 140 C 218 140 238 165 238 198 C 238 218 221 232 218 232 C 215 232 198 218 198 198 Z" fill="#2dd4bf" />
    <!-- Caliper tick marks -->
    <line x1="165" y1="270" x2="235" y2="270" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round" />
    <circle cx="200" cy="295" r="12" fill="#0d9488" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Right: Title, Tagline, Feature Badges -->
  <g transform="translate(560, 140)">
    <!-- Category Pill -->
    <rect width="360" height="38" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5" />
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#5eead4" letter-spacing="1">FIELD OPERATIONS &amp; IMMUNIZATION</text>

    <!-- App Name -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">Polio Field Tools</text>

    <!-- Tagline -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#99f6e4">Practical tools and resources for polio campaign workers</text>

    <!-- Sub description -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#ccfbf1" opacity="0.9">Calculators • Training SOPs • Communication • Field Guides</text>

    <!-- 4 Key Pill badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="42" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1" />
      <text x="14" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff">9 Calculators</text>

      <!-- Badge 2 -->
      <rect x="145" y="0" width="155" height="42" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1" />
      <text x="14" y="26" transform="translate(145,0)" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff">Training Modules</text>

      <!-- Badge 3 -->
      <rect x="310" y="0" width="165" height="42" rx="8" fill="#134e4a" stroke="#14b8a6" stroke-width="1" />
      <text x="14" y="26" transform="translate(310,0)" font-family="sans-serif" font-size="14" font-weight="600" fill="#ffffff">SBC Messages</text>
    </g>

    <!-- Geographic & Attribution Note -->
    <text x="0" y="340" font-family="sans-serif" font-size="13" font-weight="400" fill="#5eead4" opacity="0.75">Dedicated to Pakistan Field Teams • Khyber Pakhtunkhwa • Sindh • Balochistan • Punjab</text>
  </g>
</svg>
