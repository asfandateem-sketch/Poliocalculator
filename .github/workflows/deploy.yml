name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to ensure complete deployments.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: npm install
        run: npm ci || npm install

      - name: npm run build
        run: npm run build

      - name: dist generated
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Production directory 'dist' was not generated!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "::error::'dist/index.html' does not exist!"
            exit 1
          fi
          if [ ! -f "dist/data/drive_resources.json" ]; then
            echo "::error::'dist/data/drive_resources.json' does not exist!"
            exit 1
          fi
          # Guarantee .nojekyll is present to prevent Jekyll from skipping asset files
          touch dist/.nojekyll
          # SPA routing support for GitHub Pages: copy index.html to 404.html
          cp dist/index.html dist/404.html
          echo "Verified: dist directory, drive_resources.json, and assets successfully generated from latest commit."
          ls -lh dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
