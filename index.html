    <!-- Structured Data (JSON-LD) for SEO, AEO (Answer Engine Optimization), & GEO (Generative Engine Optimization) -->

    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://polio-calculator.web.app/#webapp",
          "name": "Polio Campaign Calculator",
          "url": "https://polio-calculator.web.app/",
          "applicationCategory": "HealthApplication",
          "operatingSystem": "All (Web, PWA, iOS, Android)",
          "softwareVersion": "2.4.0",
          "description": "Mobile-first offline field calculation suite for polio eradication campaign workers, vaccinators, supervisors, and UC medical officers.",
          "inLanguage": ["en", "ur"],
          "featureList": [
            "Child Age Eligibility Calculator (Under 5.0 years / < 60 months)",
            "Vaccine Vial Demand Estimator (Standard bOPV 20 doses/vial + buffer)",
            "Vaccine Wastage Rate Calculator (Field benchmark <= 10%)",
            "Not Available (NA) Coverage and Still NA Rate (Target <= 2%)",
            "Refusal Coverage & Conversion Rate (Target <= 0.5%)",
            "Missed Children Combined Coverage Assessment",
            "Overall Campaign Coverage Benchmark (Target >= 95%)",
            "Daily Catch-Up Rate Calculator for field sweeps",
            "Under-5 Target Population Estimator"
          ]
        },
        {
          "@type": "MedicalWebPage",
          "@id": "https://polio-calculator.web.app/#medicalpage",
          "url": "https://polio-calculator.web.app/",
          "name": "Polio Campaign Calculator — WHO, UNICEF & NEOC Field Standards",
          "headline": "Field Operational Calculators for Polio Eradication Campaigns",
          "audience": {
            "@type": "MedicalAudience",
            "audienceType": "Clinician, Field Vaccinator, Area Incharge, Union Council Medical Officer, Health Supervisor"
          },
          "about": [
            {
              "@type": "MedicalCondition",
              "name": "Poliomyelitis"
            },
            {
              "@type": "MedicalTherapy",
              "name": "Bivalent Oral Polio Vaccine (bOPV)"
            }
          ]
        },
        {
          "@type": "FAQPage",
          "@id": "https://polio-calculator.web.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How many doses are in one vial of bOPV oral polio vaccine?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Each standard bOPV vial contains 20 doses (2 drops per dose). Under standard GPEI/WHO campaign planning guidelines, 1 vial immunizes 20 eligible children under 5 years of age."
              }
            },
            {
              "@type": "Question",
              "name": "What is the acceptable vaccine wastage rate for polio campaigns?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The target acceptable vaccine wastage rate for oral polio campaigns is <= 10%. Wastage is calculated as ((Doses Issued - Doses Administered) / Doses Issued) * 100. Any wastage above 10% requires supervisor review."
              }
            },
            {
              "@type": "Question",
              "name": "What is the target coverage benchmark for polio campaigns?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The optimal benchmark is >= 95% of target children vaccinated. Coverage between 85% and 94.9% indicates vulnerable gaps requiring catch-up sweeps. Coverage below 85% represents a critical deficit."
              }
            },
            {
              "@type": "Question",
              "name": "What is the age eligibility criteria for polio campaign vaccination?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Any child strictly under 5.0 years of age (from newborn up to 4 years, 11 months, and 29 days, or less than 60 full months) on the campaign date is eligible to receive oral polio vaccine drops."
              }
            },
            {
              "@type": "Question",
              "name": "How is Still NA (Not Available) children coverage calculated?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Still NA % = ((Recorded NA Children - NA Children Vaccinated on Catch-Up) / Total Campaign Target) * 100. The standard field target is <= 2.0%."
              }
            },
            {
              "@type": "Question",
              "name": "How is Refusal Conversion calculated during polio campaigns?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Refusal Conversion Rate % = (Refusal Children Successfully Vaccinated / Total Initial Refusals) * 100. Still Refusal % = (Remaining Unvaccinated Refusals / Campaign Target) * 100, with a target benchmark of <= 0.5%."
              }
            }
          ]
        }
      ]
    }
    </script>
